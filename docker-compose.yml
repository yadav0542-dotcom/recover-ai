services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recover_ai
      POSTGRES_USER: recover_ai
      POSTGRES_PASSWORD: recover_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recover_ai -d recover_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recover_ai:recover_ai@postgres:5432/recover_ai
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
